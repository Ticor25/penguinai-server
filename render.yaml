services:
  - type: web
    name: penguinai-proxy
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: HF_TOKEN
        sync: false

      - key: MODEL
        value: openai/gpt-oss-120b:fastest